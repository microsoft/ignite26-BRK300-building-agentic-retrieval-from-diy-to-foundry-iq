[project]
name = "foundry-iq-auto"
version = "0.1.0"
description = "Agentic retrieval with a Foundry IQ knowledge base"
requires-python = ">=3.12"
dependencies = [
    "agent-framework-core>=1.10.0",
    "agent-framework-foundry>=1.10.0",
    "agent-framework-openai>=1.16.0",
    "agent-framework-foundry-hosting>=1.0.0b260813",
    "azure-identity>=1.25.3",
    "httpx>=0.28.1",
]

[tool.uv]
package = false

[tool.ty.environment]
python = "./.venv"
