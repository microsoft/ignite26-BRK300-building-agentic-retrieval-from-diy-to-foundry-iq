hooks:
  postprovision:
    windows:
      shell: pwsh
      run: uv run --with-requirements app/requirements.txt python -m scripts.preingest
      interactive: true
      continueOnError: false
    posix:
      shell: sh
      run: uv run --with-requirements app/requirements.txt python -m scripts.preingest
      interactive: true
      continueOnError: false