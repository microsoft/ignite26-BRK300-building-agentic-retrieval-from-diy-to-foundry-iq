# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: agentic-retrieval-diy-to-foundry-iq
metadata:
  template: agentic-retrieval-diy-to-foundry-iq@0.0.1
infra:
  provider: bicep
  path: infra
  module: main
services:
  web:
    project: ./app
    language: py
    host: containerapp
    docker:
      remoteBuild: true
  diy-baseline:
    project: python/diy-baseline
    host: azure.ai.agent
    language: python
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    environmentVariables:
      - name: FOUNDRY_MODEL_DEPLOYMENT_NAME
        value: ${FOUNDRY_MODEL_DEPLOYMENT_NAME}
      - name: FOUNDRY_IQ_SEARCH_ENDPOINT
        value: ${FOUNDRY_IQ_SEARCH_ENDPOINT}
    kind: hosted
    name: diy-baseline
    protocols:
      - protocol: responses
        version: 2.0.0
  diy-query-planning:
